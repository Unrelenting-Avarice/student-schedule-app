<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~ Web App Directory ~</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container button {
            width: 200px;
            padding: 10px;
            margin: 10px;
            font-size: 24px;
            cursor: pointer;
        }

    
    </style>
</head>
<body>
    
    <div class="container">
        <h1>Web App Directory</h1>
        <button class="btn btn-primary" id="employee-timesheet-btn">Employee Time Sheet</button>
        <button class="btn btn-primary" id="schedule-status-btn">Schedule Status</button>
    </div>
    <script>
        document.getElementById("employee-timesheet-btn").addEventListener("click", function() {
            window.location.href = "/calendar";
        });

        document.getElementById("schedule-status-btn").addEventListener("click", function() {
            window.location.href = "/schedule";
        });
    </script>
</body>
</html>
